[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "implied-vol-surface"
version = "0.1.0"
description = "Black-Scholes implied-volatility solving and simple IV surface interpolation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "requests",
    "scipy",
]

[project.optional-dependencies]
dashboard = [
    "plotly",
    "streamlit>=1.50",
]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "plotly",
    "streamlit>=1.50",
]

[tool.pytest.ini_options]
addopts = "-n auto"

[tool.setuptools.packages.find]
include = ["iv_surface*"]

[tool.ruff.lint]
# Pyflakes and syntax errors only: undefined names, unused imports and
# variables. Formatting is left as it is.
select = ["E9", "F"]

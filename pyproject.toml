[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-options-analytics"
version = "0.1.0"
description = "Deribit options dashboard with open interest, gamma exposure (GEX) and implied volatility (IV)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "requests",
    "scipy",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-n auto"

[tool.setuptools.packages.find]
include = ["options_analytics*"]

[tool.ruff.lint]
# Pyflakes and syntax errors only: undefined names, unused imports and
# variables. Formatting is left as it is.
select = ["E9", "F"]
